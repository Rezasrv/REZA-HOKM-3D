name: Build REZA HOKM APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'REZA_HOKM.zip'
      - '.github/workflows/build-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o REZA_HOKM.zip -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Find project folder
        run: |
          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REZA-HOKM-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
